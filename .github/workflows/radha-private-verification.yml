name: RADHA private revision verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/radha-private-verification.yml
  workflow_dispatch:
    inputs:
      revision:
        description: "Exact 40-character commit SHA from the private RADHA PR"
        required: true
        type: string
        default: "0d00e56e9106be86ba3e0605576e94e30faa5b28"

permissions:
  contents: read

concurrency:
  group: radha-private-revision-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify pinned private source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "0"
      GIT_TERMINAL_PROMPT: "0"
      TARGET_SHA: ${{ github.event.inputs.revision || '0d00e56e9106be86ba3e0605576e94e30faa5b28' }}
    steps:
      - name: Validate revision and private access configuration
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.RADHA_PRIVATE_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'RADHA_REVISION_INPUT=INVALID'
            exit 1
          fi
          if [[ -z "$PRIVATE_READ_TOKEN" ]]; then
            echo 'RADHA_PRIVATE_ACCESS=MISSING_SECRET'
            exit 1
          fi
          echo 'RADHA_CONFIGURATION=PASS'

      - name: Check out exact private commit without persisting token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA-pinned
        with:
          repository: ZX7-Labs/invention-radha
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.RADHA_PRIVATE_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false
          path: source

      - name: Verify source commit identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C source rev-parse HEAD)"
          if [[ "$actual" != "$TARGET_SHA" ]]; then
            echo 'RADHA_REVISION_BINDING=MISMATCH'
            exit 1
          fi
          if [[ ! -f source/invent_radha/Cargo.lock ]]; then
            echo 'RADHA_WORKSPACE=NOT_FOUND'
            exit 1
          fi
          digest="$(printf '%s' "$actual" | sha256sum | cut -d' ' -f1)"
          echo 'RADHA_REVISION_BINDING=match'
          echo "RADHA_PRIVATE_SHA256=$digest"

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          if rustup toolchain install 1.98.1 --profile minimal -c rustfmt -c clippy > "$RUNNER_TEMP/radha-rust-install.log" 2>&1; then
            echo 'RADHA_RUST_TOOLCHAIN=PASS'
          else
            echo 'RADHA_RUST_TOOLCHAIN=FAIL'
            exit 1
          fi

      - name: Check Rust formatting
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.98.1 fmt --all -- --check > "$RUNNER_TEMP/radha-fmt.log" 2>&1; then
            echo 'RADHA_FORMAT=PASS'
            echo 'RADHA_FORMAT_OK=1' >> "$GITHUB_ENV"
          else
            echo 'RADHA_FORMAT=FAIL'
            echo 'RADHA_FORMAT_OK=0' >> "$GITHUB_ENV"
            # Emit only numeric path indexes and hunk locations; never print source.
            if cargo +1.98.1 fmt --all > "$RUNNER_TEMP/radha-fmt-diagnostic.log" 2>&1; then
              mapfile -t tracked < <(git -C .. ls-files '*.rs' | LC_ALL=C sort)
              mapfile -t changed < <(git -C .. diff --name-only -- '*.rs' | LC_ALL=C sort)
              printf 'RADHA_FORMAT_FILES_NEEDING_CHANGES=%d\n' "${#changed[@]}"
              for candidate in "${changed[@]}"; do
                for i in "${!tracked[@]}"; do
                  if [[ "${tracked[$i]}" == "$candidate" ]]; then
                    index=$((i + 1))
                    printf 'RADHA_FMT_FILE_INDEX=%d\n' "$index"
                    git -C .. diff --unified=0 -- "$candidate" |
                      awk -v file_number="$index" '/^@@ / {
                        split($2, old_range, ",")
                        split($3, new_range, ",")
                        sub(/^-/, "", old_range[1])
                        sub(/^\+/, "", new_range[1])
                        printf "RADHA_FMT_HUNK=%d:%d:%d:%s:%s\n", file_number, old_range[1], new_range[1], (old_range[2] == "" ? "1" : old_range[2]), (new_range[2] == "" ? "1" : new_range[2])
                      }'
                    break
                  fi
                done
              done
            fi
            # Revert all temporary formatter modifications before compiling.
            git reset --hard HEAD > /dev/null 2>&1
          fi

      - name: Compile full Rust workspace
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.98.1 build --workspace --all-targets --locked > "$RUNNER_TEMP/radha-build.log" 2>&1; then
            echo 'RADHA_COMPILE=PASS'
          else
            echo 'RADHA_COMPILE=FAIL'
            grep -Eo 'error\[[A-Z][0-9]+\]' "$RUNNER_TEMP/radha-build.log" |
              LC_ALL=C sort -u | sed 's/^/RADHA_COMPILER_CODE=/' || true
            exit 1
          fi

      - name: Run all Rust workspace tests
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.98.1 test --workspace --all-targets --locked > "$RUNNER_TEMP/radha-test.log" 2>&1; then
            echo 'RADHA_TESTS=PASS'
            echo 'RADHA_TESTS_OK=1' >> "$GITHUB_ENV"
          else
            echo 'RADHA_TESTS=FAIL'
            echo 'RADHA_TESTS_OK=0' >> "$GITHUB_ENV"
            # Map failing names to numeric indices without publishing identifiers.
            if cargo +1.98.1 test --workspace --all-targets --locked -- --list > "$RUNNER_TEMP/radha-test-list.log" 2>&1; then
              mapfile -t test_names < <(sed -nE 's/^(.+): test$/\1/p' "$RUNNER_TEMP/radha-test-list.log")
              mapfile -t failed_names < <(sed -nE 's/^test (.+) \.\.\. FAILED$/\1/p' "$RUNNER_TEMP/radha-test.log")
              printf 'RADHA_FAILED_TEST_COUNT=%d\n' "${#failed_names[@]}"
              for failed in "${failed_names[@]}"; do
                for i in "${!test_names[@]}"; do
                  if [[ "${test_names[$i]}" == "$failed" ]]; then
                    printf 'RADHA_FAILED_TEST_INDEX=%d\n' "$((i + 1))"
                    break
                  fi
                done
              done
            fi
          fi

      - name: Locate numeric test suite for investigation
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.98.1 test --workspace --all-targets --locked -- --list > "$RUNNER_TEMP/radha-test-list.log" 2>&1; then
            awk '
              /^[[:space:]]*Running / { suite++; local_index=0; }
              /: test$/ {
                global_index++;
                local_index++;
                if (global_index == 91) {
                  printf "RADHA_TEST_91_SUITE_INDEX=%d\\n", suite;
                  printf "RADHA_TEST_91_LOCAL_INDEX=%d\\n", local_index;
                }
              }
            ' "$RUNNER_TEMP/radha-test-list.log"
          fi

      - name: Stress-check selected test by ephemeral numeric index
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexed_tests < <(sed -nE 's/^(.+): test$/\1/p' "$RUNNER_TEMP/radha-test-list.log")
          expected_digest="61179129c81368cea252fbb30814e810d695b39673d8c63e9546d95532358052"
          selected=""
          for candidate in "${indexed_tests[@]}"; do
            observed_digest="$(printf '%s' "$candidate" | sha256sum | cut -d' ' -f1)"
            if [[ "$observed_digest" == "$expected_digest" ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo 'RADHA_TEST_STRESS=IDENTITY_MISSING'
            exit 1
          fi
          echo 'RADHA_TEST_STRESS_IDENTITY=match'
          for attempt in $(seq 1 12); do
            if cargo +1.98.1 test --workspace --all-targets --locked "$selected" > "$RUNNER_TEMP/radha-repro.log" 2>&1; then
              :
            else
              echo "RADHA_TEST_STRESS=FAIL"
              echo "RADHA_TEST_STRESS_FAILED_ATTEMPT=$attempt"
              sed -nE '/panicked at / {s/^.*:([0-9]+):([0-9]+):?$/RADHA_PANIC_LOCATION=\1:\2/p;}' "$RUNNER_TEMP/radha-repro.log" | head -1
              exit 1
            fi
          done
          echo 'RADHA_TEST_STRESS=PASS_12'

      - name: Stress test recovery-supervision suite by numeric ordinal
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          expected_digest="61179129c81368cea252fbb30814e810d695b39673d8c63e9546d95532358052"
          mapfile -t indexed_tests < <(sed -nE 's/^(.+): test$/\1/p' "$RUNNER_TEMP/radha-test-list.log")
          selected=""
          for candidate in "${indexed_tests[@]}"; do
            observed_digest="$(printf '%s' "$candidate" | sha256sum | cut -d' ' -f1)"
            if [[ "$observed_digest" == "$expected_digest" ]]; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            echo 'RADHA_SUITE_TARGET=IDENTITY_MISSING'
            exit 1
          fi
          suite_entry="$(awk -v wanted="$selected" '$1 == "Running" {suite=$2} $0 == wanted ": test" {print suite; exit}' "$RUNNER_TEMP/radha-test-list.log")"
          if [[ ! "$suite_entry" =~ ^tests/[a-zA-Z0-9_]+[.]rs$ ]]; then
            echo 'RADHA_SUITE_TARGET=INVALID'
            exit 1
          fi
          suite_name="${suite_entry#tests/}"
          suite_name="${suite_name%.rs}"
          for attempt in $(seq 1 25); do
            if cargo +1.98.1 test -p cradle --test "$suite_name" --locked > "$RUNNER_TEMP/radha-target-suite.log" 2>&1; then
              :
            else
              echo 'RADHA_SUPERVISOR_SUITE_STRESS=FAIL'
              echo "RADHA_SUPERVISOR_SUITE_ATTEMPT=$attempt"
              grep -Eo 'body setup diagnostic: [a-z_]+' "$RUNNER_TEMP/radha-target-suite.log" |
                LC_ALL=C sort -u | sed 's/^body setup diagnostic: /RADHA_BODY_DIAGNOSTIC=/' || true
              grep -Eo 'fork diagnostic: [a-z_]+' "$RUNNER_TEMP/radha-target-suite.log" |
                LC_ALL=C sort -u | sed 's/^fork diagnostic: /RADHA_FORK_DIAGNOSTIC=/' || true
              sed -nE '/panicked at / {s/^.*:([0-9]+):([0-9]+):?$/RADHA_PANIC_LOCATION=\1:\2/p;}' "$RUNNER_TEMP/radha-target-suite.log" | head -3 || true
              exit 1
            fi
          done
          echo 'RADHA_SUPERVISOR_SUITE_STRESS=PASS_25'

      - name: Repeat complete workspace tests to detect intermittent failures
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t indexed_tests < <(sed -nE 's/^(.+): test$/\1/p' "$RUNNER_TEMP/radha-test-list.log")
          for attempt in 1 2 3 4; do
            if cargo +1.98.1 test --workspace --all-targets --locked > "$RUNNER_TEMP/radha-suite-stress.log" 2>&1; then
              :
            else
              echo 'RADHA_SUITE_STRESS=FAIL'
              echo "RADHA_SUITE_STRESS_ATTEMPT=$attempt"
              mapfile -t failed_names < <(sed -nE 's/^test (.+) \.\.\. FAILED$/\1/p' "$RUNNER_TEMP/radha-suite-stress.log")
              printf 'RADHA_SUITE_STRESS_FAILURES=%d\n' "${#failed_names[@]}"
              for failed in "${failed_names[@]}"; do
                for i in "${!indexed_tests[@]}"; do
                  if [[ "${indexed_tests[$i]}" == "$failed" ]]; then
                    printf 'RADHA_SUITE_STRESS_FAIL_INDEX=%d\n' "$((i + 1))"
                    break
                  fi
                done
              done
              sed -nE '/panicked at / {s/^.*:([0-9]+):([0-9]+):?$/RADHA_PANIC_LOCATION=\1:\2/p;}' "$RUNNER_TEMP/radha-suite-stress.log" | head -3 || true
              exit 1
            fi
          done
          echo 'RADHA_SUITE_STRESS=PASS_4'

      - name: Check all-target Clippy with warnings denied
        working-directory: source/invent_radha
        shell: bash
        run: |
          set -euo pipefail
          if cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings > "$RUNNER_TEMP/radha-clippy.log" 2>&1; then
            echo 'RADHA_CLIPPY=PASS'
            echo 'RADHA_CLIPPY_OK=1' >> "$GITHUB_ENV"
          else
            echo 'RADHA_CLIPPY=FAIL'
            grep -Eo 'clippy::[a-z_]+' "$RUNNER_TEMP/radha-clippy.log" | LC_ALL=C sort -u | sed 's/^/RADHA_LINT_CODE=/' || true
            grep -Eo 'error\[[A-Z][0-9]+\]' "$RUNNER_TEMP/radha-clippy.log" | LC_ALL=C sort -u | sed 's/^/RADHA_COMPILER_CODE=/' || true
            echo 'RADHA_CLIPPY_OK=0' >> "$GITHUB_ENV"
          fi

      - name: Mark exact private revision verified
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RADHA_FORMAT_OK:-0}" != "1" || "${RADHA_TESTS_OK:-0}" != "1" || "${RADHA_CLIPPY_OK:-0}" != "1" ]]; then
            echo 'RADHA_VERIFY_RESULT=FAIL_GATES'
            exit 1
          fi
          digest="$(printf '%s' "$TARGET_SHA" | sha256sum | cut -d' ' -f1)"
          echo "RADHA_PRIVATE_SHA256=$digest"
          echo 'RADHA_VERIFY_RESULT=PASS'

      - name: Clean private source and temporary diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf -- source
          rm -f -- "$RUNNER_TEMP"/radha-rust-install.log "$RUNNER_TEMP"/radha-fmt.log "$RUNNER_TEMP"/radha-build.log "$RUNNER_TEMP"/radha-test.log "$RUNNER_TEMP"/radha-clippy.log "$RUNNER_TEMP"/radha-test-list.log "$RUNNER_TEMP"/radha-suite-stress.log "$RUNNER_TEMP"/radha-target-suite.log "$RUNNER_TEMP"/radha-repro.log
          echo 'RADHA_EPHEMERAL_CLEANUP=attempted'
